<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Insu's hot chocolate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Insu's hot chocolate</h1>
      <p class="tagline">sip it to bring warmth to your heart</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="hotchoco.png" alt="a cup of hot chocolate" />
          <div class="snow" aria-hidden="true"></div>
        </div>
        <div class="button-row">
          <button id="shake">sip for warmth</button>
          <button id="fortune">stir for fortune</button>
        </div>
        <p class="message" id="message">enjoy your hot chocolate and see what settles</p>
      </section>
    </main>
    <footer>
      <p>Made by Indu, in a cozy room sipping hot chocolate</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
